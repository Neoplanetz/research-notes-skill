name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported Python without Pillow (the default install), newest with it.
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Pillow
        if: matrix.python != '3.10'
        run: python -m pip install pillow
      - name: Show browser and Pillow
        shell: python
        run: |
          import sys
          sys.stdout.reconfigure(errors="replace")
          sys.path.insert(0, "scripts")
          import render
          try:
              print("browser:", render.find_browser())
          except render.RenderError as e:
              print("browser: none -", e)
          print("Pillow:", render.HAS_PIL)
      - name: Run tests
        run: python -m unittest discover -s tests -v
